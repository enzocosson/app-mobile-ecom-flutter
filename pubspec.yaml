name: app_ecommerce
description: "ShopFlutter - Application e-commerce complète avec Flutter"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  equatable: ^2.0.7

  # Payment (optional Stripe)
  flutter_stripe: ^11.1.0

  # Biometric / Security
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Build Runner & Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.4.7
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  faker: ^2.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/products.json
    - assets/images/
